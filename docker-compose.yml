services:
  certs:
    container_name: lemp-certs
    image: alpine:3.20
    volumes:
      - ./nginx/certs:/certs
    command: >
      sh -c "[ -f /certs/server.crt ] || (apk add --no-cache openssl &&
      openssl req -x509 -nodes -newkey rsa:2048 -days 365
      -keyout /certs/server.key -out /certs/server.crt
      -subj '/CN=localhost'
      -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1')"

  nginx:
    container_name: lemp-nginx
    image: nginx:1.29.4-alpine
    ports:
      - 80:80
      - 443:443
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./web:/usr/share/nginx/html
      - ./php/src:/var/www/html
    networks:
      - frontend
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail -k https://localhost/ || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      php:
        condition: service_healthy
      certs:
        condition: service_completed_successfully

  mysql:
    container_name: lemp-mysql
    image: mysql:8.0
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init_recetario.sql:/docker-entrypoint-initdb.d/init_recetario.sql:ro
      - ./mysql/seed_recetario.sql:/docker-entrypoint-initdb.d/seed_recetario.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  php:
    container_name: lemp-php
    build:
      context: ./php
      args:
        VERSION: 8.2
    volumes:
      - ./php/src:/var/www/html
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      LOCAL_NOMBRE: ${LOCAL_NOMBRE:-}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-}
      CHEF_USER: ${CHEF_USER:-}
      CHEF_PASSWORD: ${CHEF_PASSWORD:-}
      AYUDANTE_USER: ${AYUDANTE_USER:-}
      AYUDANTE_PASSWORD: ${AYUDANTE_PASSWORD:-}
      PERMITIR_REGISTRO: ${PERMITIR_REGISTRO:-0}
    networks:
      - backend
      - frontend
    healthcheck:
      test: [ "CMD-SHELL", "pidof php-fpm || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
