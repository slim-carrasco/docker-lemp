services:
  nginx:
    container_name: lemp-nginx
    image: nginx:1.29.4-alpine
    ports:
      - 80:80
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./web:/usr/share/nginx/html
      - ./php/src:/var/www/html
    networks:
      - frontend
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail http://localhost:80 || exit 1"  ]
      interval: 3s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      php:
        condition: service_healthy
      
  mysql:
    container_name: lemp-mysql
    image: mysql:8.0
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init_recetario.sql:/docker-entrypoint-initdb.d/init_recetario.sql:ro
      - ./mysql/seed_recetario.sql:/docker-entrypoint-initdb.d/seed_recetario.sql:ro
    environment: 
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
  php:
    container_name: lemp-php
    build:
      context: ./php
      args:
        VERSION: 8.2
    volumes:
      - ./php/src:/var/www/html
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - backend
      - frontend
    healthcheck:
      test: [ "CMD-SHELL", "pidof php-fpm || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql-data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
