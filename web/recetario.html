  );
}

// ── ImportView ────────────────────────────────────────────────────────────
function ImportView({onImport,onCancel}){
  const[json,setJson]=useState('');const[err,setErr]=useState('');const[loading,setLoading]=useState(false);
  async function doImport(){
    let arr;
    try{
      const p=JSON.parse(json);
      arr=Array.isArray(p)?p:[p];
    }catch(e){setErr('JSON inválido. Revisa el formato.');return}
    if(arr.length===0||!arr.every(r=>r&&r.nombre)){setErr('Cada receta debe tener "nombre".');return}
    setLoading(true);
    try{
      await onImport(arr);
    }catch(e){
      setErr('No se pudo importar: '+e.message);
      setLoading(false);
    }
  }
  return(
    <div>
      <button onClick={onCancel} style={S.back}><i className="ti ti-arrow-left"/>Recetario</button>
      <h2 style={{fontSize:18,fontWeight:500,fontFamily:'var(--font-voice)',color:'var(--text-primary)',marginBottom:6}}>Importar recetas</h2>
      <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:14,lineHeight:1.5}}>Pega un JSON con una receta o un array de recetas. Todas se importan de una vez.</p>
      <textarea value={json} onChange={e=>{setJson(e.target.value);setErr('')}}
        placeholder={'[\n  { "nombre": "Carlota de durazno", ... },\n  { "nombre": "Carlota de limón", ... }\n]'}
        style={{...S.inp,minHeight:180,fontFamily:'var(--font-mono)',fontSize:12,borderColor:err?'var(--border-danger)':'var(--border-strong)',resize:'vertical'}}/>
      {err&&<p style={{fontSize:13,color:'var(--text-danger)',marginTop:6}}>{err}</p>}
      <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:12}}>
        <button onClick={onCancel}>Cancelar</button>
        <button onClick={doImport} style={S.acct} disabled={loading}><i className="ti ti-upload" style={{marginRight:4}}/>{loading?'Importando...':'Importar'}</button>
      </div>
    </div>
  );
}

// ── CostosSection ─────────────────────────────────────────────────────────
function CostosSection(){
  const[precios,setPrecios]=useState([]);
  const[ready,setReady]=useState(false);
  const[search,setSearch]=useState('');
  const[catFiltro,setCatFiltro]=useState('all');
  const[editing,setEditing]=useState(null);
  const[form,setForm]=useState({nombre:'',precio:'',unidad:'',categoria:'Lácteos',notas:''});
  const[saving,setSaving]=useState(false);
  const[toast,setToast]=useState(null);

  const notify=(msg,err=false)=>{setToast({msg,err});setTimeout(()=>setToast(null),2500)};

  async function load(){
    try{const d=await getAll('precios');setPrecios(d);}
    catch(e){notify('No se pudieron cargar los precios: '+e.message,true);}
    setReady(true);
  }
  useEffect(()=>{load()},[]);

  function openNew(){setForm({nombre:'',precio:'',unidad:'',categoria:'Lácteos',notas:''});setEditing('new')}
  function openEdit(p){setForm({nombre:p.nombre,precio:p.precio,unidad:p.unidad,categoria:p.categoria,notas:p.notas||''});setEditing(p)}

  async function save(){
    if(!form.nombre.trim()||form.precio===''||!form.unidad.trim()){alert('Nombre, precio y unidad son obligatorios');return}
    if(!(Number(form.precio)>=0)){alert('El precio debe ser un número igual o mayor que 0');return}
    setSaving(true);
    const data={nombre:form.nombre.trim(),precio:Number(form.precio),unidad:form.unidad.trim(),categoria:form.categoria,notas:form.notas.trim()||null};
    const nuevo=editing==='new';
    try{
      if(nuevo) await post('precios',data);
      else await put('precios',editing.id,data);
      await load();setEditing(null);notify(nuevo?'Precio agregado':'Precio actualizado');
    }catch(e){
      notify('No se guardó: '+e.message,true);
    }
    setSaving(false);
  }

  async function remove(id){
    if(!confirm('¿Eliminar este precio?'))return;
    try{await del('precios',id);await load();notify('Eliminado');}
    catch(e){notify('No se eliminó: '+e.message,true);}
  }

  const filtered=precios.filter(p=>{
    const q=search.toLowerCase();
    if(catFiltro!=='all'&&p.categoria!==catFiltro)return false;
    return !q||p.nombre.toLowerCase().includes(q)||p.categoria.toLowerCase().includes(q);
  });

  const grouped=CATEGORIAS.reduce((acc,cat)=>{
    const items=filtered.filter(p=>p.categoria===cat);
    if(items.length>0)acc[cat]=items;
    return acc;
  },{});
  const sinCat=filtered.filter(p=>!CATEGORIAS.includes(p.categoria));
  if(sinCat.length>0)grouped['Otros']=[...(grouped['Otros']||[]),...sinCat];

  if(!ready)return <div style={{padding:40,textAlign:'center',color:'var(--text-muted)',fontSize:14}}>Cargando...</div>;

  if(editing){
    return(
      <div>
        {toast&&<Toast msg={toast.msg} err={toast.err}/>}
        <button onClick={()=>setEditing(null)} style={S.back}><i className="ti ti-arrow-left"/>Costos</button>
        <h2 style={{fontSize:18,fontWeight:500,fontFamily:'var(--font-voice)',color:'var(--text-primary)',marginBottom:18}}>{editing==='new'?'Nuevo precio':'Editar precio'}</h2>
        <div style={{marginBottom:12}}><label style={S.lbl}>Nombre</label><input style={S.inp} value={form.nombre} onChange={e=>setForm(p=>({...p,nombre:e.target.value}))} placeholder="Leche evaporada..."/></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
          <div><label style={S.lbl}>Precio S/</label><input style={S.inp} type="number" min="0" step="0.01" value={form.precio} onChange={e=>setForm(p=>({...p,precio:e.target.value}))} placeholder="4.00"/></div>
          <div><label style={S.lbl}>Unidad</label><input style={S.inp} value={form.unidad} onChange={e=>setForm(p=>({...p,unidad:e.target.value}))} placeholder="lata (400g), kg, L..."/></div>
        </div>
        <div style={{marginBottom:12}}>
          <label style={S.lbl}>Categoría</label>
          <select style={S.inp} value={form.categoria} onChange={e=>setForm(p=>({...p,categoria:e.target.value}))}>
            {CATEGORIAS.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div style={{marginBottom:18}}><label style={S.lbl}>Notas</label><input style={S.inp} value={form.notas} onChange={e=>setForm(p=>({...p,notas:e.target.value}))} placeholder="Referencia adicional..."/></div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button onClick={()=>setEditing(null)}>Cancelar</button>
          <button onClick={save} style={S.acct} disabled={saving}><i className="ti ti-check" style={{marginRight:4}}/>{saving?'Guardando...':'Guardar'}</button>
        </div>
      </div>
    );
  }

  return(
    <div>
      {toast&&<Toast msg={toast.msg} err={toast.err}/>}
      <div style={{display:'flex',gap:6,marginBottom:10}}>
        <div style={{flex:1,position:'relative'}}>
          <i className="ti ti-search" style={{position:'absolute',left:9,top:'50%',transform:'translateY(-50%)',fontSize:13,color:'var(--text-muted)',pointerEvents:'none'}}/>
          <input style={{...S.inp,paddingLeft:30}} placeholder="Buscar ingrediente..." value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <button onClick={openNew} style={S.acct}><i className="ti ti-plus" style={{marginRight:4}}/>Agregar</button>
      </div>
      <div style={{display:'flex',gap:6,marginBottom:16,flexWrap:'wrap'}}>
        {['all',...CATEGORIAS].map(c=>(
          <button key={c} onClick={()=>setCatFiltro(c)}
            style={{fontSize:11,padding:'4px 10px',borderRadius:99,background:catFiltro===c?'var(--fill-accent)':'transparent',color:catFiltro===c?'var(--on-accent)':'var(--text-muted)',border:catFiltro===c?'none':'1px solid var(--border)',transition:'all .15s'}}>
            {c==='all'?'Todos':c}
          </button>
        ))}
      </div>
      {Object.keys(grouped).length===0?(
        <div style={{textAlign:'center',padding:'48px 20px',color:'var(--text-muted)'}}>
          <i className="ti ti-tag" style={{fontSize:36,display:'block',marginBottom:10}}/>
          <p style={{fontSize:14,color:'var(--text-secondary)'}}>{search?'Sin resultados para esa búsqueda':catFiltro!=='all'?'No hay precios en esta categoría':'Agrega tu primer precio de referencia'}</p>
        </div>
      ):(
        Object.entries(grouped).map(([cat,items])=>(
          <div key={cat} style={{marginBottom:20}}>
            <div style={S.sec}>{cat}</div>
            <div style={{display:'grid',gap:5}}>
              {items.map(p=>(
                <div key={p.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 13px',background:'var(--surface-2)',borderRadius:8,border:'.5px solid var(--border)'}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:500,color:'var(--text-primary)'}}>{p.nombre}</div>
                    {p.notas&&<div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>{p.notas}</div>}
                  </div>
                  <div style={{textAlign:'right',flexShrink:0}}>
                    <div style={{fontSize:14,fontWeight:500,color:'var(--text-accent)'}}>S/ {Number(p.precio).toFixed(2)}</div>
                    <div style={{fontSize:11,color:'var(--text-muted)'}}>{p.unidad}</div>
                  </div>
                  <div style={{display:'flex',gap:16,flexShrink:0,marginLeft:6}}>
                    <button onClick={()=>openEdit(p)} style={{padding:0,width:28,height:28,justifyContent:'center',color:'var(--text-muted)'}} title="Editar"><i className="ti ti-edit" style={{fontSize:13}}/></button>
                    <button onClick={()=>remove(p.id)} style={{padding:0,width:28,height:28,justifyContent:'center',color:'var(--text-danger)'}} title="Eliminar"><i className="ti ti-trash" style={{fontSize:13}}/></button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        ))
      )}
      <div style={{marginTop:8,padding:'10px 13px',background:'var(--surface-1)',borderRadius:8,fontSize:12,color:'var(--text-muted)'}}>
        {precios.length} precios guardados{precios.length>0&&precios.some(p=>p.actualizado)?` · Última actualización: ${new Date(precios.reduce((a,b)=>(a.actualizado||'')>(b.actualizado||'')?a:b).actualizado).toLocaleDateString('es-PE')}`:''}
      </div>
    </div>
  );
}

// ── Menú de hoy ───────────────────────────────────────────────────────────
function MenuSection({sesion,perm,recetas,onCambio,setSesion}){
  const[data,setData]=useState(null);
  const[ready,setReady]=useState(false);
  const[agregar,setAgregar]=useState('');
  const[toast,setToast]=useState(null);
  const notify=(msg,err=false)=>{setToast({msg,err});setTimeout(()=>setToast(null),2500)};
  const url=`${location.origin}/menu.html?local=${encodeURIComponent(sesion.local.slug)}`;

  async function load(){
    try{setData(await getAll('menu'))}
    catch(e){notify('No se pudo cargar el menú: '+e.message,true)}
    setReady(true);
  }
  useEffect(()=>{load()},[]);

  async function quitar(id){
    try{await del('menu',id);await load();await onCambio();notify('Quitada del menú de hoy')}
    catch(e){notify(e.message,true)}
  }
  async function sumar(){
    if(!agregar)return;
    try{await post('menu',{receta_id:Number(agregar)});setAgregar('');await load();await onCambio();notify('Agregada al menú de hoy')}
    catch(e){notify(e.message,true)}
  }
  async function cambiarPrecios(v){
    try{
      await putSolo('ajustes',{mostrar_precios:v});
      setSesion(s=>({...s,local:{...s.local,mostrar_precios:v}}));
      notify(v?'Los precios se muestran en el menú público':'Los precios se ocultan en el menú público');
    }catch(e){notify(e.message,true)}
  }
  function copiar(){
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(url).then(()=>notify('Enlace copiado')).catch(()=>prompt('Copia el enlace:',url));
    }else{prompt('Copia el enlace:',url)}
  }

  if(!ready)return <div style={{padding:40,textAlign:'center',color:'var(--text-muted)',fontSize:14}}>Cargando...</div>;

  const platos=(data&&data.platos)||[];
  const enMenu=new Set(platos.map(p=>p.id));
  const disponibles=recetas.filter(r=>!enMenu.has(r.id));

  return(
    <div>
      {toast&&<Toast msg={toast.msg} err={toast.err}/>}
      <h2 style={{fontSize:18,fontWeight:500,fontFamily:'var(--font-voice)',marginBottom:2}}>Menú de hoy</h2>
      <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:16,textTransform:'capitalize'}}>{data?fechaLarga(data.fecha):''}</p>

      <div style={{...S.card,marginBottom:16}}>
        <div style={S.lbl}>Enlace para los clientes</div>
        <div style={{fontSize:12,color:'var(--text-secondary)',wordBreak:'break-all',marginBottom:8}}>{url}</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
          <a href={url} target="_blank" rel="noopener" style={{fontSize:13}}>Abrir</a>
          <button onClick={copiar}><i className="ti ti-link" style={{marginRight:4}}/>Copiar enlace</button>
          {perm.dueno&&(
            <label style={{display:'flex',alignItems:'center',gap:6,fontSize:13,cursor:'pointer',marginLeft:8}}>
              <input type="checkbox" checked={!!sesion.local.mostrar_precios} onChange={e=>cambiarPrecios(e.target.checked)}/>
              Mostrar precios de venta
            </label>
          )}
        </div>
      </div>

      {platos.length===0?(
        <div style={{textAlign:'center',padding:'36px 20px',color:'var(--text-muted)'}}>
          <i className="ti ti-calendar" style={{fontSize:32,display:'block',marginBottom:8}}/>
          <p style={{fontSize:14,color:'var(--text-secondary)'}}>Hoy no hay platos en el menú</p>
        </div>
      ):(
        <div style={{display:'grid',gap:6,marginBottom:16}}>
          {platos.map(p=>(
            <div key={p.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 13px',background:'var(--surface-2)',borderRadius:8,border:'.5px solid var(--border)'}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:500}}>{p.nombre}</div>
                {p.descripcion&&<div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>{p.descripcion}</div>}
              </div>
              {perm.precios&&p.precio_venta!=null&&<span style={{fontSize:14,fontWeight:500,color:'var(--text-accent)'}}>S/ {Number(p.precio_venta).toFixed(2)}</span>}
              {perm.editar&&<button onClick={()=>quitar(p.id)} style={{padding:0,width:28,height:28,justifyContent:'center',color:'var(--text-danger)'}} title="Quitar del menú"><i className="ti ti-x" style={{fontSize:13}}/></button>}
            </div>
          ))}
        </div>
      )}

      {perm.editar&&(
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          <select style={{...S.inp,flex:1,minWidth:200}} value={agregar} onChange={e=>setAgregar(e.target.value)}>
            <option value="">Agregar una receta al menú de hoy...</option>
            {disponibles.map(r=><option key={r.id} value={r.id}>{r.nombre}</option>)}
          </select>
          <button onClick={sumar} style={S.acct} disabled={!agregar}><i className="ti ti-plus" style={{marginRight:4}}/>Agregar</button>
        </div>
      )}
    </div>
  );
}

// ── Usuarios (solo el dueño) ──────────────────────────────────────────────
function UsuariosSection({sesion}){
  const[lista,setLista]=useState([]);
  const[ready,setReady]=useState(false);
  const[form,setForm]=useState({usuario:'',nombre:'',rol:'chef',clave:''});
  const[saving,setSaving]=useState(false);
  const[toast,setToast]=useState(null);
  const notify=(msg,err=false)=>{setToast({msg,err});setTimeout(()=>setToast(null),3000)};

  async function load(){
    try{setLista(await getAll('usuarios'))}
    catch(e){notify('No se pudo cargar la lista: '+e.message,true)}
    setReady(true);
  }
  useEffect(()=>{load()},[]);

  async function crear(e){
    e.preventDefault();
    const u=form.usuario.trim().toLowerCase();
    if(!/^[a-z0-9._-]{3,30}$/.test(u)){notify('El usuario debe tener de 3 a 30 caracteres: minúsculas, números, punto, guion o guion bajo',true);return}
    if(!form.nombre.trim()){notify('Escribe el nombre de la persona',true);return}
    if(form.clave.length<8||form.clave.length>72){notify('La contraseña debe tener entre 8 y 72 caracteres',true);return}
    setSaving(true);
    try{
      await post('usuarios',{usuario:u,nombre:form.nombre.trim(),rol:form.rol,clave:form.clave});
      setForm({usuario:'',nombre:'',rol:'chef',clave:''});
      await load();
      notify('Usuario creado');
    }catch(err){notify(err.message,true)}
    setSaving(false);
  }
  async function actualizar(id,datos,msg){
    try{await put('usuarios',id,datos);await load();notify(msg)}
    catch(e){notify(e.message,true);await load()}
  }
  function nuevaClave(u){
    const c=prompt(`Nueva contraseña para ${u.usuario} (8 a 72 caracteres):`);
    if(c===null)return;
    actualizar(u.id,{clave:c},'Contraseña actualizada');
  }

  if(!ready)return <div style={{padding:40,textAlign:'center',color:'var(--text-muted)',fontSize:14}}>Cargando...</div>;

  return(
    <div>
      {toast&&<Toast msg={toast.msg} err={toast.err}/>}
      <h2 style={{fontSize:18,fontWeight:500,fontFamily:'var(--font-voice)',marginBottom:4}}>Usuarios del local</h2>
      <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:16}}>Código para iniciar sesión: <strong>{sesion.local.slug}</strong></p>

      <div style={{display:'grid',gap:6,marginBottom:20}}>
        {lista.map(u=>{
          const yo=u.id===sesion.id;
          return(
            <div key={u.id} style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',padding:'10px 13px',background:'var(--surface-2)',borderRadius:8,border:'.5px solid var(--border)',opacity:u.activo?1:.6}}>
              <div style={{flex:1,minWidth:140}}>
                <div style={{fontSize:13,fontWeight:500}}>{u.nombre}{yo?' (tú)':''}</div>
                <div style={{fontSize:11,color:'var(--text-muted)'}}>{u.usuario}{u.activo?'':' · desactivado'}</div>
              </div>
              <select style={{...S.inp,width:'auto'}} value={u.rol} disabled={yo} onChange={e=>actualizar(u.id,{rol:e.target.value},'Rol actualizado')}>
                <option value="dueno">Dueño</option>
                <option value="chef">Chef</option>
                <option value="ayudante">Ayudante</option>
              </select>
              <button onClick={()=>nuevaClave(u)} title="Cambiar contraseña"><i className="ti ti-key"/></button>
              <button disabled={yo} onClick={()=>actualizar(u.id,{activo:!u.activo},u.activo?'Usuario desactivado':'Usuario activado')}>{u.activo?'Desactivar':'Activar'}</button>
            </div>
          );
        })}
      </div>

      <form onSubmit={crear} style={S.card}>
        <div style={S.lbl}>Nuevo usuario</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
          <input style={S.inp} placeholder="Nombre de la persona" value={form.nombre} onChange={e=>setForm(p=>({...p,nombre:e.target.value}))}/>
          <input style={S.inp} placeholder="Usuario (para entrar)" value={form.usuario} onChange={e=>setForm(p=>({...p,usuario:e.target.value}))} autoCapitalize="none" autoComplete="off"/>
          <select style={S.inp} value={form.rol} onChange={e=>setForm(p=>({...p,rol:e.target.value}))}>
            <option value="chef">Chef</option>
            <option value="ayudante">Ayudante</option>
            <option value="dueno">Dueño</option>
          </select>
          <input style={S.inp} type="password" placeholder="Contraseña (8 a 72)" value={form.clave} onChange={e=>setForm(p=>({...p,clave:e.target.value}))} autoComplete="new-password"/>
        </div>
        <button type="submit" style={S.acct} disabled={saving}><i className="ti ti-plus" style={{marginRight:4}}/>{saving?'Creando...':'Crear usuario'}</button>
      </form>
    </div>
  );
}

// ── Mi cuenta ─────────────────────────────────────────────────────────────
function CuentaSection({sesion}){
  const[f,setF]=useState({actual:'',nueva:'',repetir:''});
  const[saving,setSaving]=useState(false);
  const[toast,setToast]=useState(null);
  const notify=(msg,err=false)=>{setToast({msg,err});setTimeout(()=>setToast(null),3000)};

  async function guardar(e){
    e.preventDefault();
    if(f.nueva!==f.repetir){notify('Las contraseñas nuevas no coinciden',true);return}
    if(f.nueva.length<8||f.nueva.length>72){notify('La contraseña debe tener entre 8 y 72 caracteres',true);return}
    setSaving(true);
    try{
      await post('clave',{actual:f.actual,nueva:f.nueva});
      setF({actual:'',nueva:'',repetir:''});
      notify('Contraseña actualizada');
    }catch(err){notify(err.message,true)}
    setSaving(false);
  }

  return(
    <div>
      {toast&&<Toast msg={toast.msg} err={toast.err}/>}
      <h2 style={{fontSize:18,fontWeight:500,fontFamily:'var(--font-voice)',marginBottom:14}}>Mi cuenta</h2>
      <div style={{...S.card,marginBottom:16,fontSize:13,lineHeight:1.9}}>
        <div><span style={{color:'var(--text-muted)'}}>Nombre: </span>{sesion.nombre}</div>
        <div><span style={{color:'var(--text-muted)'}}>Usuario: </span>{sesion.usuario}</div>
        <div><span style={{color:'var(--text-muted)'}}>Rol: </span>{ROL_TXT[sesion.rol]||sesion.rol}</div>
        <div><span style={{color:'var(--text-muted)'}}>Local: </span>{sesion.local.nombre} · código <strong>{sesion.local.slug}</strong></div>
      </div>
      <form onSubmit={guardar} style={S.card}>
        <div style={S.lbl}>Cambiar contraseña</div>
        <div style={{display:'grid',gap:10,marginBottom:12}}>
          <input style={S.inp} type="password" placeholder="Contraseña actual" value={f.actual} onChange={e=>setF(p=>({...p,actual:e.target.value}))} autoComplete="current-password"/>
          <input style={S.inp} type="password" placeholder="Contraseña nueva (8 a 72)" value={f.nueva} onChange={e=>setF(p=>({...p,nueva:e.target.value}))} autoComplete="new-password"/>
          <input style={S.inp} type="password" placeholder="Repetir la nueva" value={f.repetir} onChange={e=>setF(p=>({...p,repetir:e.target.value}))} autoComplete="new-password"/>
        </div>
        <button type="submit" style={S.acct} disabled={saving}>{saving?'Guardando...':'Guardar contraseña'}</button>
      </form>
    </div>
  );
}

// ── Aplicación con sesión iniciada ────────────────────────────────────────
function Principal({sesion,setSesion,onSalir,bienvenida,cerrarBienvenida}){
  const rol=sesion.rol;
  const perm={editar:rol==='dueno'||rol==='chef',dueno:rol==='dueno',precios:rol!=='ayudante'};
  const[state,setState]=useState({recetas:[],carpetas:[]});
  const[ready,setReady]=useState(false);
  const[view,setView]=useState('list');
  const[seccion,setSeccion]=useState('recetario');
  const[selId,setSelId]=useState(null);
  const[selRecipe,setSelRecipe]=useState(null);
  const[toast,setToast]=useState(null);
  const[error,setError]=useState(null);

  const notify=(msg,err=false,ms=2500)=>{setToast({msg,err});setTimeout(()=>setToast(null),ms)};
  const irA=s=>{setSeccion(s);setView('list')};

  async function reload(){
    try{
      const data=await get('state');
      setState({recetas:data.recetas||[],carpetas:data.carpetas||[]});
      setError(null);
    }catch(e){
      if(e.status!==401) setError('No se pudo conectar con la API: '+e.message);
    }
    setReady(true);
  }
  useEffect(()=>{reload()},[]);

  async function loadRecipe(id){
    try{
      const r=await get('receta',id);
      setSelRecipe(r);
      setSelId(id);
      setView('detail');
    }catch(e){
      notify('No se pudo abrir la receta: '+e.message,true);
    }
  }

  async function saveRecipe(data){
    try{
      let res;
      if(selId&&view==='form'&&selRecipe){
        res=await put('recetas',selId,data);
        setSelRecipe(res.receta);
      } else {
        res=await post('recetas',data);
        setSelId(res.id);
        setSelRecipe(res.receta);
      }
      await reload();
      setView('detail');
      notify('Receta guardada');
    }catch(e){
      notify('No se guardó la receta: '+e.message,true);
    }
  }

  async function deleteRecipe(){
    if(!confirm('¿Eliminar esta receta?'))return;
    try{
      await del('recetas',selId);
      await reload();
      setView('list');
      setSelId(null);setSelRecipe(null);
      notify('Receta eliminada');
    }catch(e){
      notify('No se eliminó la receta: '+e.message,true);
    }
  }

  async function saveCarpeta(data){
    try{
      await post('carpetas',data);
      await reload();
      notify('Carpeta creada');
    }catch(e){
      notify('No se creó la carpeta: '+e.message,true);
    }
  }

  async function deleteCarpeta(id){
    if(!confirm('¿Eliminar carpeta? Las recetas quedan sin carpeta.'))return;
    try{
      await del('carpetas',id);
      await reload();
      notify('Carpeta eliminada');
    }catch(e){
      notify('No se eliminó la carpeta: '+e.message,true);
    }
  }

  async function importRecipes(arr){
    await post('import',arr);
    await reload();
    setView('list');
    notify(`${arr.length} receta${arr.length>1?'s':''} importada${arr.length>1?'s':''}`);
  }

  async function toggleMenu(rec){
    try{
      if(rec.disponible_hoy) await del('menu',rec.id);
      else await post('menu',{receta_id:rec.id});
      setSelRecipe(r=>r&&r.id===rec.id?{...r,disponible_hoy:!rec.disponible_hoy}:r);
      await reload();
      notify(rec.disponible_hoy?'Quitada del menú de hoy':'Agregada al menú de hoy');
    }catch(e){
      notify('No se pudo actualizar el menú: '+e.message,true);
    }
  }

  async function cambiarCarpeta(rec,valor){
    const cid=valor?Number(valor):null;
    try{
      await post('mover',{ids:[rec.id],carpeta_id:cid});
      setSelRecipe(r=>r&&r.id===rec.id?{...r,carpeta_id:cid}:r);
      await reload();
      notify('Carpeta actualizada');
    }catch(e){
      notify('No se pudo cambiar la carpeta: '+e.message,true);
    }
  }

  async function moverLote(ids,carpetaId){
    try{
      await post('mover',{ids,carpeta_id:carpetaId});
      await reload();
      notify(`${ids.length} receta${ids.length!==1?'s':''} movida${ids.length!==1?'s':''}`);
      return true;
    }catch(e){
      notify('No se pudo mover: '+e.message,true);
      return false;
    }
  }

  async function eliminarLote(ids,confirmar){
    try{
      await post('eliminar',{ids,confirmar});
      await reload();
      notify(`${ids.length} receta${ids.length!==1?'s':''} eliminada${ids.length!==1?'s':''}`);
      return true;
    }catch(e){
      notify('No se pudo eliminar: '+e.message,true);
      return false;
    }
  }

  if(!ready)return <div style={{padding:40,textAlign:'center',color:'var(--text-muted)',fontSize:14}}>Cargando...</div>;
  if(error)return(
    <div style={{padding:40,maxWidth:500,margin:'0 auto'}}>
      <div style={{padding:'16px 20px',background:'var(--bg-danger)',borderRadius:12,border:'.5px solid var(--border-danger)'}}>
        <div style={{fontSize:14,fontWeight:500,color:'var(--text-danger)',marginBottom:6}}>Error de conexión</div>
        <div style={{fontSize:13,color:'var(--text-danger)',lineHeight:1.5,marginBottom:12}}>{error}</div>
        <div style={{fontSize:12,color:'var(--text-muted)',lineHeight:1.6}}>
          Verifica que:<br/>
          1. La API responde en <code>/recetario/api.php</code> (archivos en <code>php/src/recetario/</code>)<br/>
          2. La base de datos <code>recetario</code> existe y coincide con <code>MYSQL_DATABASE</code> del <code>.env</code><br/>
          3. Las tablas existen: se crean con <code>mysql/init_recetario.sql</code> solo en el primer arranque, con el volumen vacío
        </div>
        <button onClick={reload} style={{marginTop:12,...S.acct}}>Reintentar</button>
      </div>
    </div>
  );

  return(
    <div style={S.page}>
      {toast&&<Toast msg={toast.msg} err={toast.err}/>}
      {view!=='cook'&&(
        <div className="no-print" style={{paddingTop:16}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:12}}>
            <div>
              <span onClick={()=>irA('recetario')} style={{fontFamily:'var(--font-voice)',fontSize:17,fontWeight:500,color:'var(--text-primary)',cursor:'pointer'}}>Recetario</span>
              <div style={{fontSize:11,color:'var(--text-muted)'}}>{sesion.local.nombre}</div>
            </div>
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <button onClick={()=>irA('cuenta')} title="Mi cuenta"><i className="ti ti-user" style={{marginRight:5}}/>{sesion.nombre}<span style={{...S.rol,marginLeft:7}}>{ROL_TXT[rol]}</span></button>
              <button onClick={onSalir} title="Cerrar sesión"><i className="ti ti-logout"/></button>
            </div>
          </div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',paddingBottom:14,borderBottom:'.5px solid var(--border-strong)',marginBottom:20}}>
            <Tab activo={seccion==='recetario'} onClick={()=>irA('recetario')} icono="book">Recetas</Tab>
            <Tab activo={seccion==='menu'} onClick={()=>irA('menu')} icono="calendar">Menú de hoy</Tab>
            {perm.precios&&<Tab activo={seccion==='costos'} onClick={()=>irA('costos')} icono="tag">Costos</Tab>}
            {perm.dueno&&<Tab activo={seccion==='usuarios'} onClick={()=>irA('usuarios')} icono="users">Usuarios</Tab>}
          </div>
        </div>
      )}

      {bienvenida&&seccion==='recetario'&&view==='list'&&(
        <div className="no-print" style={{padding:'10px 14px',background:'var(--bg-accent)',border:'.5px solid var(--border-accent)',borderRadius:10,fontSize:13,lineHeight:1.6,marginBottom:14}}>
          Tu local «{bienvenida.local}» quedó registrado. Para volver a entrar usa el código <strong>{bienvenida.slug}</strong>, tu usuario y tu contraseña.
          <div style={{marginTop:8}}><button onClick={cerrarBienvenida}>Entendido</button></div>
        </div>
      )}

      {seccion==='recetario'&&view==='list'&&<RecipeList recipes={state.recetas} carpetas={state.carpetas} perm={perm} onSel={loadRecipe} onNew={()=>{setSelId(null);setSelRecipe(null);setView('form')}} onImport={()=>setView('import')} onManageCarpetas={()=>setView('carpetas')} onMover={moverLote} onEliminar={eliminarLote}/>}

      {seccion==='recetario'&&view==='detail'&&selRecipe&&<RecipeDetail recipe={selRecipe} carpetas={state.carpetas} perm={perm} onBack={()=>setView('list')} onEdit={()=>setView('form')} onDelete={deleteRecipe} onCook={()=>setView('cook')} onToggleMenu={toggleMenu} onCarpeta={cambiarCarpeta}/>}

      {seccion==='recetario'&&view==='form'&&perm.editar&&<RecipeForm initial={selId?selRecipe:null} carpetas={state.carpetas} onSave={saveRecipe} onCancel={()=>setView(selId?'detail':'list')}/>}

      {seccion==='recetario'&&view==='cook'&&selRecipe&&<CookMode recipe={selRecipe} onExit={()=>setView('detail')}/>}

      {seccion==='recetario'&&view==='import'&&perm.dueno&&<ImportView onImport={importRecipes} onCancel={()=>setView('list')}/>}

      {seccion==='recetario'&&view==='carpetas'&&perm.editar&&<CarpetasManager carpetas={state.carpetas} onSave={saveCarpeta} onDelete={deleteCarpeta} onClose={()=>setView('list')}/>}

      {seccion==='menu'&&<MenuSection sesion={sesion} perm={perm} recetas={state.recetas} onCambio={reload} setSesion={setSesion}/>}
      {seccion==='costos'&&perm.precios&&<CostosSection/>}
      {seccion==='usuarios'&&perm.dueno&&<UsuariosSection sesion={sesion}/>}
      {seccion==='cuenta'&&<CuentaSection sesion={sesion}/>}
    </div>
  );
}

// ── App: decide entre inicio de sesión y aplicación ───────────────────────
function App(){
  const[sesion,setSesion]=useState(undefined);   // undefined: comprobando · null: sin sesión
  const[pantalla,setPantalla]=useState('login');
  const[permitido,setPermitido]=useState(false);
  const[errRed,setErrRed]=useState(null);
  const[aviso,setAviso]=useState('');
  const[bienvenida,setBienvenida]=useState(null);

  async function comprobar(){
    setErrRed(null);
    try{
      const d=await get('me');
      setSesion(d);
    }catch(e){
      if(e.status===401) setSesion(null);
      else setErrRed(e.message);
    }
    try{const r=await get('registro');setPermitido(!!r.permitido)}catch(e){}
  }
  useEffect(()=>{comprobar()},[]);

  useEffect(()=>{
    const h=()=>{setSesion(null);setAviso('Tu sesión terminó. Inicia sesión de nuevo.');setPantalla('login')};
    window.addEventListener('sesion-expirada',h);
    return ()=>window.removeEventListener('sesion-expirada',h);
  },[]);

  async function salir(){
    try{await post('logout',{})}catch(e){}
    setSesion(null);setAviso('');setBienvenida(null);setPantalla('login');
  }

  if(errRed)return(
    <div style={{padding:40,maxWidth:500,margin:'0 auto'}}>
      <div style={{padding:'16px 20px',background:'var(--bg-danger)',borderRadius:12,border:'.5px solid var(--border-danger)'}}>
        <div style={{fontSize:14,fontWeight:500,color:'var(--text-danger)',marginBottom:6}}>Error de conexión</div>
        <div style={{fontSize:13,color:'var(--text-danger)',lineHeight:1.5,marginBottom:12}}>{errRed}</div>
        <button onClick={comprobar} style={S.acct}>Reintentar</button>
      </div>
    </div>
  );
  if(sesion===undefined)return <div style={{padding:40,textAlign:'center',color:'var(--text-muted)',fontSize:14}}>Cargando...</div>;
  if(!sesion){
    if(pantalla==='registro')return <Registro onOk={d=>{setSesion(d);setBienvenida({local:d.local.nombre,slug:d.local.slug})}} onVolver={()=>setPantalla('login')}/>;
    return <Login onOk={d=>{setAviso('');setSesion(d)}} onRegistro={()=>setPantalla('registro')} permitido={permitido} aviso={aviso}/>;
  }
  return <Principal key={sesion.id} sesion={sesion} setSesion={setSesion} onSalir={salir} bienvenida={bienvenida} cerrarBienvenida={()=>setBienvenida(null)}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
