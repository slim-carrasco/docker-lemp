<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recetario</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif'%3ER%3C/text%3E%3C/svg%3E"/>
  <link href="vendor/tabler/tabler-icons.min.css" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
      --font-mono:'SF Mono','Fira Code',monospace;
      --font-voice:'Playfair Display',Georgia,serif;
      --radius:8px;
      --surface-0:#f8f5f0;--surface-1:#ede9e1;--surface-2:#ffffff;
      --text-primary:#1a1a1a;--text-secondary:#4a4542;--text-muted:#6b6560;
      --text-accent:#1d6ef5;--text-danger:#c0392b;--text-success:#1a7a3c;--text-warning:#b45309;
      --border:rgba(0,0,0,.10);--border-strong:rgba(0,0,0,.16);
      --border-accent:#3b82f6;--border-danger:#e74c3c;
      --fill-accent:#2563eb;--on-accent:#fff;
      --fill-success:#16a34a;--on-success:#fff;
      --bg-accent:#eff6ff;--bg-danger:#fef2f2;--bg-warning:#fffbeb;
    }
    body{font-family:var(--font-sans);background:var(--surface-0);color:var(--text-primary);-webkit-font-smoothing:antialiased}
    a{color:var(--text-accent)}
    button{font-family:var(--font-sans);font-size:13px;padding:7px 13px;border-radius:var(--radius);border:.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);cursor:pointer;display:inline-flex;align-items:center;transition:background .1s;line-height:1}
    button:hover:not(:disabled){background:var(--surface-1)}
    button:disabled{opacity:.35;cursor:default;pointer-events:none}
    input,textarea,select{font-family:var(--font-sans);font-size:13px}
    input[type=checkbox]{width:14px;height:14px;cursor:pointer}
    .solo-print{display:none}
    @media print{
      @page{margin:14mm}
      body{background:#fff}
      .no-print,button{display:none !important}
      .solo-print{display:block !important}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Config ────────────────────────────────────────────────────────────────
const API = '/recetario/api.php';

// Toda respuesta con error HTTP o con campo "error" lanza una excepción con su código
async function req(url, opts){
  let r;
  try { r = await fetch(url, opts); }
  catch (e) { const err = new Error('Sin conexión con el servidor'); err.status = 0; throw err; }
  let data = null;
  try { data = await r.json(); } catch (e) { data = null; }
  if (!r.ok || (data && data.error)) {
    const err = new Error((data && data.error) || ('Error ' + r.status));
    err.status = r.status;
    // Sesión vencida en medio del uso: se vuelve a la pantalla de inicio de sesión
    if (r.status === 401 && !/entity=(login|registro|me)\b/.test(url)) {
      window.dispatchEvent(new Event('sesion-expirada'));
    }
    throw err;
  }
  return data;
}
const jsonOpts = (method, body) => ({method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
const get     = (entity, id) => req(`${API}?entity=${entity}${id ? '&id='+id : ''}`);
const getAll  = (entity) => req(`${API}?entity=${entity}`);
const post    = (entity, body) => req(`${API}?entity=${entity}`, jsonOpts('POST', body));
const put     = (entity, id, body) => req(`${API}?entity=${entity}&id=${id}`, jsonOpts('PUT', body));
const putSolo = (entity, body) => req(`${API}?entity=${entity}`, jsonOpts('PUT', body));
const del     = (entity, id) => req(`${API}?entity=${entity}&id=${id}`, {method:'DELETE'});

// ── Utils ─────────────────────────────────────────────────────────────────
const uid  = () => Math.random().toString(36).slice(2,9);
const scl  = (v,base,cur) => { if(v==null) return null; const r=(v*cur)/base; return Number.isInteger(r)?r:parseFloat(r.toFixed(2)); };
const fmt  = s => { const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60; return h?`${h}:${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`; };
const fechaCorta = f => { if(!f) return ''; const d=new Date(String(f).replace(' ','T')); return isNaN(d)?'':d.toLocaleDateString('es-PE'); };
const fechaLarga = f => { const d=new Date(f+'T12:00:00'); return isNaN(d)?f:d.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}); };
const ROL_TXT = {dueno:'Dueño',chef:'Chef',ayudante:'Ayudante'};

// Descarga un archivo JSON (funciona en HTTP y HTTPS, a diferencia del portapapeles)
function descargarJSON(nombreArchivo, data){
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombreArchivo;
  a.click();
  URL.revokeObjectURL(a.href);
}

// Búsqueda por ingredientes: sin tildes, sin mayúsculas, palabra completa (plural opcional)
const norm = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc  = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const cumple = (txt,t) => new RegExp('(^|[^a-z])'+esc(t)+'(s|es)?([^a-z]|$)').test(norm(txt));

// ── Categorías de precios
const CATEGORIAS = ['Lácteos','Frutas','Secos','Otros'];

// ── Shared styles ─────────────────────────────────────────────────────────
const S = {
  page:{maxWidth:700,margin:'0 auto',padding:'0 12px 80px'},
  hdr:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'18px 0 14px',borderBottom:'.5px solid var(--border-strong)',marginBottom:20},
  back:{display:'inline-flex',alignItems:'center',gap:4,fontSize:13,color:'var(--text-muted)',background:'none',border:'none',padding:0,cursor:'pointer',marginBottom:14},
  sec:{fontSize:10,fontWeight:500,textTransform:'uppercase',letterSpacing:'1.2px',color:'var(--text-muted)',marginBottom:10,paddingBottom:8,borderBottom:'.5px solid var(--border)'},
  inp:{width:'100%',padding:'8px 10px',borderRadius:'var(--radius)',border:'.5px solid var(--border-strong)',fontSize:13,fontFamily:'inherit',background:'#fff',color:'var(--text-primary)',outline:'none',boxSizing:'border-box'},
  lbl:{display:'block',fontSize:10,fontWeight:500,textTransform:'uppercase',letterSpacing:'1px',color:'var(--text-muted)',marginBottom:5},
  acct:{background:'var(--fill-accent)',color:'var(--on-accent)',border:'none'},
  danger:{color:'var(--text-danger)',borderColor:'var(--border-danger)'},
  success:{background:'var(--fill-success)',color:'var(--on-success)',border:'none'},
  num:{flexShrink:0,width:26,height:26,borderRadius:99,background:'var(--fill-accent)',color:'var(--on-accent)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:500},
  alt:{fontSize:10,fontWeight:500,padding:'2px 7px',borderRadius:99,background:'var(--bg-warning)',color:'var(--text-warning)',whiteSpace:'nowrap',flexShrink:0},
  hoy:{fontSize:10,fontWeight:500,padding:'2px 7px',borderRadius:99,background:'#ecfdf5',color:'var(--text-success)',whiteSpace:'nowrap',flexShrink:0},
  rol:{fontSize:10,fontWeight:500,padding:'2px 7px',borderRadius:99,background:'var(--bg-accent)',color:'var(--text-accent)',whiteSpace:'nowrap'},
  card:{background:'var(--surface-2)',border:'.5px solid var(--border-strong)',borderRadius:12,padding:18},
};

// ── Timer ─────────────────────────────────────────────────────────────────
function Timer({secs,big}){
  const[rem,setRem]=useState(secs);const[on,setOn]=useState(false);const iv=useRef(null);
  useEffect(()=>()=>clearInterval(iv.current),[]);
  function toggle(){if(rem<=0)return;if(on){clearInterval(iv.current);setOn(false)}else{setOn(true);iv.current=setInterval(()=>setRem(r=>{if(r<=1){clearInterval(iv.current);setOn(false);return 0}return r-1}),1000)}}
  function reset(){clearInterval(iv.current);setOn(false);setRem(secs)}
  const done=rem===0;
  return(
    <div style={{display:'flex',alignItems:'center',gap:8,marginTop:big?16:8}}>
      <span style={{fontSize:big?32:15,fontWeight:500,fontVariantNumeric:'tabular-nums',fontFamily:'var(--font-mono)',minWidth:big?88:50,color:done?'var(--text-success)':on?'var(--text-accent)':'var(--text-primary)'}}>{done?'Listo':fmt(rem)}</span>
      {!done&&<button onClick={toggle} style={{padding:'4px 10px'}}><i className={`ti ti-player-${on?'pause':'play'}`} style={{fontSize:big?14:12}}/></button>}
      {(on||rem!==secs)&&!done&&<button onClick={reset} style={{padding:'4px 10px'}}><i className="ti ti-refresh" style={{fontSize:big?14:12}}/></button>}
    </div>
  );
}

function Sec({title,children}){return <div style={{marginBottom:28}}><div style={S.sec}>{title}</div>{children}</div>}

// ── CarpetaBadge ──────────────────────────────────────────────────────────
function CarpetaBadge({color,nombre}){
  return <span style={{fontSize:10,fontWeight:500,padding:'2px 8px',borderRadius:99,background:color+'22',color,border:`1px solid ${color}44`,whiteSpace:'nowrap',flexShrink:0}}>{nombre}</span>;
}

// ── Toast ─────────────────────────────────────────────────────────────────
function Toast({msg,err}){
  return <div style={{textAlign:'center',padding:'8px 16px',background:err?'var(--text-danger)':'var(--fill-accent)',color:'var(--on-accent)',borderRadius:'var(--radius)',fontSize:13,fontWeight:500,marginBottom:12}}>{msg}</div>;
}

function Tab({activo,onClick,icono,children}){
  return(
    <button onClick={onClick} style={{fontSize:12,padding:'5px 12px',borderRadius:99,background:activo?'var(--fill-accent)':'transparent',color:activo?'var(--on-accent)':'var(--text-muted)',border:activo?'none':'1px solid var(--border)'}}>
      <i className={`ti ti-${icono}`} style={{marginRight:4,fontSize:12}}/>{children}
    </button>
  );
}

// ── Login ─────────────────────────────────────────────────────────────────
function Login({onOk,onRegistro,permitido,aviso}){
  let guardado='';
  try{guardado=localStorage.getItem('recetario_local')||''}catch(e){}
  const[local,setLocal]=useState(guardado);
  const[usuario,setUsuario]=useState('');
  const[clave,setClave]=useState('');
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);

  async function entrar(e){
    e.preventDefault();
    setErr('');
    if(!local.trim()||!usuario.trim()||!clave){setErr('Completa el código del local, el usuario y la contraseña');return}
    setLoading(true);
    try{
      const data=await post('login',{local:local.trim(),usuario:usuario.trim(),clave});
      try{localStorage.setItem('recetario_local',data.local.slug)}catch(e2){}
      onOk(data);
    }catch(e2){
      setErr(e2.message);
      setLoading(false);
    }
  }

  return(
    <div style={{maxWidth:380,margin:'0 auto',padding:'48px 16px'}}>
      <h1 style={{fontSize:26,fontWeight:500,fontFamily:'var(--font-voice)',marginBottom:4}}>Recetario</h1>
      <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:22}}>Inicia sesión con el código de tu local.</p>
      {aviso&&<div style={{padding:'8px 12px',background:'var(--bg-warning)',color:'var(--text-warning)',borderRadius:8,fontSize:13,marginBottom:14}}>{aviso}</div>}
      <form onSubmit={entrar} style={S.card}>
        <div style={{marginBottom:12}}>
          <label style={S.lbl}>Código del local</label>
          <input style={S.inp} value={local} onChange={e=>setLocal(e.target.value)} placeholder="ej.: local-de-ejemplo" autoCapitalize="none" autoComplete="off"/>
        </div>
        <div style={{marginBottom:12}}>
          <label style={S.lbl}>Usuario</label>
          <input style={S.inp} value={usuario} onChange={e=>setUsuario(e.target.value)} autoCapitalize="none" autoComplete="username"/>
        </div>
        <div style={{marginBottom:14}}>
          <label style={S.lbl}>Contraseña</label>
          <input style={S.inp} type="password" value={clave} onChange={e=>setClave(e.target.value)} autoComplete="current-password"/>
        </div>
        {err&&<p style={{fontSize:13,color:'var(--text-danger)',marginBottom:12}}>{err}</p>}
        <button type="submit" style={{...S.acct,width:'100%',justifyContent:'center',padding:'10px 13px'}} disabled={loading}>{loading?'Entrando...':'Entrar'}</button>
      </form>
      <div style={{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:8,marginTop:16,fontSize:13}}>
        <a href={local.trim()?`menu.html?local=${encodeURIComponent(local.trim())}`:'menu.html'}>Ver el menú de hoy</a>
        {permitido&&<a href="#" onClick={e=>{e.preventDefault();onRegistro()}}>Registrar mi local</a>}
      </div>
    </div>
  );
}

// ── Registro de un local nuevo ────────────────────────────────────────────
function Registro({onOk,onVolver}){
  const[f,setF]=useState({local_nombre:'',nombre:'',usuario:'',clave:'',clave2:''});
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));

  async function registrar(e){
    e.preventDefault();
    setErr('');
    if(f.local_nombre.trim().length<3){setErr('El nombre del local debe tener al menos 3 caracteres');return}
    if(!f.nombre.trim()){setErr('Escribe tu nombre');return}
    if(!/^[a-z0-9._-]{3,30}$/.test(f.usuario.trim().toLowerCase())){setErr('El usuario debe tener de 3 a 30 caracteres: minúsculas, números, punto, guion o guion bajo');return}
    if(f.clave.length<8||f.clave.length>72){setErr('La contraseña debe tener entre 8 y 72 caracteres');return}
    if(f.clave!==f.clave2){setErr('Las contraseñas no coinciden');return}
    setLoading(true);
    try{
      const data=await post('registro',{local_nombre:f.local_nombre.trim(),nombre:f.nombre.trim(),usuario:f.usuario.trim().toLowerCase(),clave:f.clave});
      try{localStorage.setItem('recetario_local',data.local.slug)}catch(e2){}
      onOk(data);
    }catch(e2){
      setErr(e2.message);
      setLoading(false);
    }
  }

  return(
    <div style={{maxWidth:380,margin:'0 auto',padding:'40px 16px'}}>
      <h1 style={{fontSize:24,fontWeight:500,fontFamily:'var(--font-voice)',marginBottom:4}}>Registrar mi local</h1>
      <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:20}}>Crea el local y la cuenta del dueño. Luego podrás agregar a tu equipo.</p>
      <form onSubmit={registrar} style={S.card}>
        <div style={{marginBottom:12}}><label style={S.lbl}>Nombre del local</label><input style={S.inp} value={f.local_nombre} onChange={e=>set('local_nombre',e.target.value)} autoComplete="off"/></div>
        <div style={{marginBottom:12}}><label style={S.lbl}>Tu nombre</label><input style={S.inp} value={f.nombre} onChange={e=>set('nombre',e.target.value)} autoComplete="name"/></div>
        <div style={{marginBottom:12}}><label style={S.lbl}>Usuario</label><input style={S.inp} value={f.usuario} onChange={e=>set('usuario',e.target.value)} autoCapitalize="none" autoComplete="username"/></div>
        <div style={{marginBottom:12}}><label style={S.lbl}>Contraseña (8 a 72 caracteres)</label><input style={S.inp} type="password" value={f.clave} onChange={e=>set('clave',e.target.value)} autoComplete="new-password"/></div>
        <div style={{marginBottom:14}}><label style={S.lbl}>Repetir contraseña</label><input style={S.inp} type="password" value={f.clave2} onChange={e=>set('clave2',e.target.value)} autoComplete="new-password"/></div>
        {err&&<p style={{fontSize:13,color:'var(--text-danger)',marginBottom:12}}>{err}</p>}
        <button type="submit" style={{...S.acct,width:'100%',justifyContent:'center',padding:'10px 13px'}} disabled={loading}>{loading?'Creando...':'Crear local'}</button>
      </form>
      <p style={{marginTop:16,fontSize:13}}><a href="#" onClick={e=>{e.preventDefault();onVolver()}}>Volver a iniciar sesión</a></p>
    </div>
  );
}

// ── RecipeList ────────────────────────────────────────────────────────────
function RecipeList({recipes,carpetas,perm,onSel,onNew,onImport,onManageCarpetas,onMover,onEliminar}){
  const[search,setSearch]=useState('');
  const[ingQ,setIngQ]=useState('');
  const[carpetaFiltro,setCarpetaFiltro]=useState('all');
  const[selMode,setSelMode]=useState(false);
  const[sel,setSel]=useState([]);
  const[destino,setDestino]=useState('__');

  const terms = ingQ.split(',').map(t=>norm(t).trim()).filter(Boolean);

  async function exportAll(){
    try{
      const data=await getAll('export');
      descargarJSON('recetario-'+new Date().toISOString().slice(0,10)+'.json', data);
    }catch(e){alert('No se pudo exportar: '+e.message)}
  }

  const filtered = recipes.filter(r=>{
    const q=search.toLowerCase().trim();
    if(carpetaFiltro!=='all'){
      if(carpetaFiltro==='sin' && r.carpeta_id) return false;
      if(carpetaFiltro!=='sin' && String(r.carpeta_id)!==carpetaFiltro) return false;
    }
    if(terms.length && !terms.every(t=>cumple(r.ingredientes_txt,t))) return false;
    if(!q) return true;
    return r.nombre.toLowerCase().includes(q);
  });

  // Las acciones masivas solo actúan sobre lo seleccionado que está a la vista
  const idsVisibles = filtered.map(r=>r.id);
  const selVis = sel.filter(id=>idsVisibles.includes(id));
  const todosMarcados = idsVisibles.length>0 && idsVisibles.every(id=>sel.includes(id));
  const toggle = id => setSel(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  function salirSel(){setSelMode(false);setSel([]);setDestino('__')}

  async function mover(){
    if(!selVis.length||destino==='__')return;
    const ok=await onMover(selVis,destino===''?null:Number(destino));
    if(ok) salirSel();
  }
  async function eliminar(){
    const n=selVis.length;
    if(!n)return;
    let confirmar='';
    if(n>5){
      const t=prompt(`Vas a eliminar ${n} recetas con sus ingredientes y pasos. Escribe ELIMINAR para confirmar.`);
      if(t!=='ELIMINAR')return;
      confirmar='ELIMINAR';
    }else if(!confirm(`¿Eliminar ${n} receta${n!==1?'s':''}? No se puede deshacer.`)){
      return;
    }
    const ok=await onEliminar(selVis,confirmar);
    if(ok) salirSel();
  }

  return(
    <div>
      <div style={{display:'flex',gap:6,marginBottom:10}}>
        <div style={{flex:1,position:'relative'}}>
          <i className="ti ti-search" style={{position:'absolute',left:9,top:'50%',transform:'translateY(-50%)',fontSize:13,color:'var(--text-muted)',pointerEvents:'none'}}/>
          <input style={{...S.inp,paddingLeft:30}} placeholder="Buscar receta..." value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
      </div>
      <input style={{...S.inp,marginBottom:10}} placeholder="Ingredientes que tengo: pollo, arroz..." value={ingQ} onChange={e=>setIngQ(e.target.value)}/>

      <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
        {[{id:'all',nombre:'Todas',color:'#6b6560'},{id:'sin',nombre:'Sin carpeta',color:'#777'},...carpetas].map(c=>(
          <button key={c.id} onClick={()=>setCarpetaFiltro(String(c.id))}
            style={{fontSize:11,padding:'4px 10px',borderRadius:99,background:String(carpetaFiltro)===String(c.id)?c.color+'22':'transparent',color:String(carpetaFiltro)===String(c.id)?c.color:'var(--text-muted)',border:`1px solid ${String(carpetaFiltro)===String(c.id)?c.color+'66':'var(--border)'}`,transition:'all .15s'}}>
            {c.nombre}
          </button>
        ))}
        {perm.editar&&<button onClick={onManageCarpetas} style={{fontSize:11,padding:'4px 10px',borderRadius:99,color:'var(--text-muted)',borderStyle:'dashed'}}><i className="ti ti-folder-plus" style={{fontSize:11,marginRight:3}}/>Carpetas</button>}
      </div>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,gap:8,flexWrap:'wrap'}}>
        <span style={{fontSize:13,color:'var(--text-muted)'}}>{filtered.length} receta{filtered.length!==1?'s':''}</span>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {perm.dueno&&<button onClick={exportAll}><i className="ti ti-download" style={{marginRight:4}}/>Exportar todo</button>}
          {perm.dueno&&<button onClick={onImport}><i className="ti ti-upload" style={{marginRight:4}}/>Importar JSON</button>}
          {perm.editar&&<button onClick={()=>selMode?salirSel():setSelMode(true)}><i className="ti ti-checkbox" style={{marginRight:4}}/>{selMode?'Cancelar selección':'Seleccionar'}</button>}
          {perm.editar&&<button onClick={onNew} style={S.acct}><i className="ti ti-plus" style={{marginRight:4}}/>Nueva</button>}
        </div>
      </div>

      {selMode&&(
        <div className="no-print" style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',padding:'10px 12px',background:'var(--bg-accent)',border:'.5px solid var(--border-accent)',borderRadius:10,marginBottom:14}}>
          <span style={{fontSize:13,fontWeight:500}}>{selVis.length} seleccionada{selVis.length!==1?'s':''}</span>
          <button onClick={()=>setSel(todosMarcados?[]:idsVisibles)}>{todosMarcados?'Quitar todas':'Seleccionar todo'}</button>
          <select style={{...S.inp,width:'auto',minWidth:150}} value={destino} onChange={e=>setDestino(e.target.value)}>
            <option value="__">Elegir carpeta...</option>
            <option value="">Sin carpeta</option>
            {carpetas.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}
          </select>
          <button onClick={mover} disabled={!selVis.length||destino==='__'}><i className="ti ti-folder-plus" style={{marginRight:4}}/>Mover</button>
          {perm.dueno&&<button onClick={eliminar} disabled={!selVis.length} style={S.danger}><i className="ti ti-trash" style={{marginRight:4}}/>Eliminar</button>}
        </div>
      )}

      {filtered.length===0?(
        <div style={{textAlign:'center',padding:'48px 20px',color:'var(--text-muted)'}}>
          <i className="ti ti-file-plus" style={{fontSize:36,display:'block',marginBottom:10}}/>
          <p style={{fontSize:14,color:'var(--text-secondary)'}}>{(search||terms.length)?'Sin resultados para esa búsqueda':carpetaFiltro!=='all'?'No hay recetas en esta carpeta':perm.editar?'Agrega tu primera receta':'Aún no hay recetas'}</p>
        </div>
      ):(
        <div style={{display:'grid',gap:8}}>
          {filtered.map(r=>{
            const marcada=sel.includes(r.id);
            return(
            <div key={r.id} onClick={()=>selMode?toggle(r.id):onSel(r.id)}
              style={{background:'var(--surface-2)',borderRadius:12,padding:'14px 16px',border:marcada?'1.5px solid var(--border-accent)':'.5px solid var(--border-strong)',cursor:'pointer',transition:'border-color .15s',display:'flex',gap:12,alignItems:'flex-start'}}
              onMouseEnter={e=>{if(!marcada)e.currentTarget.style.borderColor='var(--border-accent)'}}
              onMouseLeave={e=>{if(!marcada)e.currentTarget.style.borderColor='var(--border-strong)'}}>
              {selMode&&<input type="checkbox" checked={marcada} onChange={()=>toggle(r.id)} onClick={e=>e.stopPropagation()} style={{marginTop:4,flexShrink:0}}/>}
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,marginBottom:4}}>
                  <span style={{fontSize:16,fontWeight:500,fontFamily:'var(--font-voice)',color:'var(--text-primary)'}}>{r.nombre}</span>
                  <div style={{display:'flex',gap:5,alignItems:'center',flexShrink:0,flexWrap:'wrap',justifyContent:'flex-end'}}>
                    {r.disponible_hoy&&<span style={S.hoy}>Hoy</span>}
                    {r.carpeta_nombre&&<CarpetaBadge color={r.carpeta_color} nombre={r.carpeta_nombre}/>}
                    {r.altitud&&<span style={S.alt}>Altitud</span>}
                  </div>
                </div>
                {r.descripcion&&<p style={{fontSize:13,color:'var(--text-muted)',lineHeight:1.5,marginBottom:6}}>{r.descripcion}</p>}
                <div style={{display:'flex',gap:12,fontSize:11,color:'var(--text-muted)',flexWrap:'wrap'}}>
                  <span><i className="ti ti-users" style={{fontSize:11,marginRight:3}}/>{r.porciones_base} porciones</span>
                  <span><i className="ti ti-list-check" style={{fontSize:11,marginRight:3}}/>{r.n_pasos} pasos</span>
                  {r.n_errores>0&&<span style={{color:'var(--text-warning)'}}><i className="ti ti-notes" style={{fontSize:11,marginRight:3}}/>{r.n_errores} error{r.n_errores!==1?'es':''} registrado{r.n_errores!==1?'s':''}</span>}
                </div>
              </div>
            </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── RecipeDetail ──────────────────────────────────────────────────────────
function RecipeDetail({recipe,carpetas,perm,onBack,onEdit,onDelete,onCook,onToggleMenu,onCarpeta}){
  const[svgs,setSvgs]=useState(recipe.porciones_base||4);
  const[copied,setCopied]=useState('');
  const carpeta=carpetas.find(c=>c.id==recipe.carpeta_id);
  function imprimir(){
    const anterior=document.title;
    document.title='Ficha - '+recipe.nombre;
    window.print();
    document.title=anterior;
  }
  // Mismo formato que "Exportar todo": sin ids, con el nombre de la carpeta
  function copyJSON(){
    const exp={
      nombre:recipe.nombre,
      descripcion:recipe.descripcion,
      carpeta:carpeta?carpeta.nombre:null,
      porciones_base:recipe.porciones_base,
      altitud:recipe.altitud,
      notas:recipe.notas,
      precio_venta:recipe.precio_venta,
      fecha:recipe.fecha,
      ingredientes:(recipe.ingredientes||[]).map(i=>({nombre:i.nombre,cantidad:i.cantidad,unidad:i.unidad,precio:i.precio})),
      pasos:(recipe.pasos||[]).map(p=>({titulo:p.titulo,descripcion:p.descripcion,timer:p.timer})),
      errores:recipe.errores||[],
    };
    const text=JSON.stringify(exp,null,2);
    const ok=(msg)=>{setCopied(msg);setTimeout(()=>setCopied(''),2000)};
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(text).then(()=>ok('Copiado')).catch(()=>{descargarJSON(recipe.nombre+'.json',exp);ok('Descargado')});
    }else{
      descargarJSON(recipe.nombre+'.json',exp);
      ok('Descargado');
    }
  }

  const ingsConPrecio=(recipe.ingredientes||[]).filter(i=>i.precio!=null);
  const total=ingsConPrecio.reduce((acc,i)=>acc+(scl(i.precio,recipe.porciones_base,svgs)||0),0);

  return(
    <div>
      <div className="solo-print" style={{fontSize:11,color:'#555',marginBottom:8}}>Ficha de receta estándar · {svgs} porciones</div>
      <button onClick={onBack} style={S.back}><i className="ti ti-arrow-left"/>Recetario</button>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12,marginBottom:4}}>
        <h1 style={{fontSize:22,fontWeight:500,fontFamily:'var(--font-voice)',color:'var(--text-primary)',lineHeight:1.2}}>{recipe.nombre}</h1>
        <div style={{display:'flex',gap:5,alignItems:'center',marginTop:4,flexShrink:0,flexWrap:'wrap',justifyContent:'flex-end'}}>
          {recipe.disponible_hoy&&<span style={S.hoy}>Disponible hoy</span>}
          {carpeta&&<CarpetaBadge color={carpeta.color} nombre={carpeta.nombre}/>}
          {recipe.altitud&&<span style={S.alt}>Altitud</span>}
        </div>
      </div>
      {recipe.descripcion&&<p style={{fontSize:13,color:'var(--text-muted)',lineHeight:1.6,marginBottom:8}}>{recipe.descripcion}</p>}
      <p style={{fontSize:11,color:'var(--text-muted)',marginBottom:16}}>
        {recipe.creado_por_nombre?`Creada por ${recipe.creado_por_nombre}`:'Creada'}{recipe.fecha?` · ${fechaCorta(recipe.fecha)}`:''}
        {perm.precios&&recipe.precio_venta!=null?` · Precio de venta: S/ ${Number(recipe.precio_venta).toFixed(2)}`:''}
      </p>

      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>
        <button onClick={onCook} style={S.acct}><i className="ti ti-chef-hat" style={{marginRight:4}}/>Modo cocina</button>
        {perm.editar&&<button onClick={onEdit}><i className="ti ti-edit" style={{marginRight:4}}/>Editar</button>}
        {perm.editar&&<button onClick={()=>onToggleMenu(recipe)}><i className="ti ti-calendar" style={{marginRight:4}}/>{recipe.disponible_hoy?'Quitar del menú de hoy':'Disponible hoy'}</button>}
        {perm.dueno&&<button onClick={copyJSON}><i className={`ti ti-${copied?'check':'copy'}`} style={{marginRight:4}}/>{copied||'Copiar JSON'}</button>}
        <button onClick={imprimir}><i className="ti ti-printer" style={{marginRight:4}}/>Imprimir ficha</button>
        {perm.dueno&&<button onClick={onDelete} style={S.danger} title="Eliminar receta"><i className="ti ti-trash"/></button>}
      </div>

      {perm.editar&&(
        <div className="no-print" style={{display:'flex',alignItems:'center',gap:8,marginBottom:16}}>
          <span style={{fontSize:12,color:'var(--text-muted)'}}>Carpeta</span>
          <select style={{...S.inp,width:'auto',minWidth:170}} value={recipe.carpeta_id||''} onChange={e=>onCarpeta(recipe,e.target.value)}>
            <option value="">Sin carpeta</option>
            {carpetas.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}
          </select>
        </div>
      )}

      <div style={{display:'inline-flex',alignItems:'center',gap:12,padding:'8px 14px',borderRadius:'var(--radius)',background:'var(--bg-accent)',border:'.5px solid var(--border-accent)',marginBottom:24}}>
        <span style={{fontSize:12,color:'var(--text-muted)'}}>Porciones</span>
        <button onClick={()=>setSvgs(s=>Math.max(1,s-1))} style={{width:26,height:26,borderRadius:99,padding:0,display:'flex',alignItems:'center',justifyContent:'center'}}><i className="ti ti-minus" style={{fontSize:12}}/></button>
        <span style={{fontSize:17,fontWeight:500,color:'var(--text-primary)',minWidth:26,textAlign:'center'}}>{svgs}</span>
        <button onClick={()=>setSvgs(s=>s+1)} style={{width:26,height:26,borderRadius:99,padding:0,display:'flex',alignItems:'center',justifyContent:'center'}}><i className="ti ti-plus" style={{fontSize:12}}/></button>
      </div>

      <Sec title="Ingredientes">
        <div style={{display:'grid',gap:5}}>
          {(recipe.ingredientes||[]).map(ing=>{
            const s=scl(ing.cantidad,recipe.porciones_base,svgs);
            const p=scl(ing.precio,recipe.porciones_base,svgs);
            return(
              <div key={ing.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 13px',background:'var(--surface-2)',borderRadius:8,border:'.5px solid var(--border)'}}>
                <span style={{fontSize:13,color:'var(--text-primary)',flex:1}}>{ing.nombre}</span>
                <div style={{display:'flex',gap:12,alignItems:'center',marginLeft:12,flexShrink:0}}>
                  <span style={{fontSize:13,fontWeight:500,color:'var(--text-accent)',whiteSpace:'nowrap'}}>{s!=null?`${s}${ing.unidad?' '+ing.unidad:''}`:'c/n'}</span>
                  {perm.precios&&<span style={{fontSize:12,color:p!=null?'var(--text-success)':'var(--text-muted)',minWidth:64,textAlign:'right',whiteSpace:'nowrap'}}>{p!=null?`S/ ${p.toFixed(2)}`:'sin precio'}</span>}
                </div>
              </div>
            );
          })}
        </div>
        {perm.precios&&ingsConPrecio.length>0&&(
          <div style={{marginTop:8,padding:'10px 13px',background:'var(--bg-accent)',borderRadius:8,border:'.5px solid var(--border-accent)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span style={{fontSize:13,fontWeight:500,color:'var(--text-primary)'}}>Total ({svgs} porción{svgs!==1?'es':''})</span>
              <span style={{fontSize:14,fontWeight:500,color:'var(--text-accent)'}}>S/ {total.toFixed(2)}</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',marginTop:3}}>
              <span style={{fontSize:11,color:'var(--text-muted)'}}>{(recipe.ingredientes||[]).length-ingsConPrecio.length>0?`${(recipe.ingredientes||[]).length-ingsConPrecio.length} sin precio`:'todos incluidos'}</span>
              <span style={{fontSize:11,color:'var(--text-muted)'}}>S/ {(total/svgs).toFixed(2)} por porción</span>
            </div>
          </div>
        )}
      </Sec>

      <Sec title="Pasos">
        <div style={{display:'grid',gap:8}}>
          {(recipe.pasos||[]).map((p,i)=>(
            <div key={p.id} style={{display:'flex',gap:12,padding:14,background:'var(--surface-2)',borderRadius:10,border:'.5px solid var(--border)'}}>
              <div style={S.num}>{i+1}</div>
              <div style={{flex:1,minWidth:0}}>
                {p.titulo&&<div style={{fontSize:13,fontWeight:500,color:'var(--text-primary)',marginBottom:3}}>{p.titulo}</div>}
                <div style={{fontSize:13,color:'var(--text-secondary)',lineHeight:1.6}}>{p.descripcion}</div>
                {p.timer&&<Timer key={`${p.id}-${recipe.id}`} secs={Number(p.timer)}/>}
              </div>
            </div>
          ))}
        </div>
      </Sec>

      {recipe.notas&&<Sec title="Notas"><div style={{padding:'12px 14px',borderLeft:'3px solid var(--border-accent)',fontSize:13,color:'var(--text-secondary)',lineHeight:1.7,whiteSpace:'pre-wrap'}}>{recipe.notas}</div></Sec>}

      {(recipe.errores||[]).length>0&&(
        <Sec title="Errores registrados">
          <div style={{display:'grid',gap:5}}>
            {recipe.errores.map((e,i)=>(
              <div key={i} style={{display:'flex',gap:8,padding:'9px 12px',background:'var(--bg-warning)',borderRadius:8,fontSize:13,color:'var(--text-warning)',alignItems:'flex-start'}}>
                <i className="ti ti-notes" style={{flexShrink:0,marginTop:1}}/>{e}
              </div>
            ))}
          </div>
        </Sec>
      )}
    </div>
  );
}

// ── CookMode ──────────────────────────────────────────────────────────────
function CookMode({recipe,onExit}){
  const[step,setStep]=useState(0);
  const pasos=recipe.pasos||[];
  const total=pasos.length;
  if(total===0){
    return(
      <div style={{background:'#111',borderRadius:12,minHeight:320,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14}}>
        <span style={{fontSize:14,color:'#aaa'}}>Esta receta no tiene pasos.</span>
        <button onClick={onExit} style={{...S.acct,fontSize:13}}>Volver</button>
      </div>
    );
  }
  const cur=pasos[step];
  return(
    <div style={{background:'#111',borderRadius:12,minHeight:520,display:'flex',flexDirection:'column'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 18px',borderBottom:'.5px solid #2a2a2a'}}>
        <span style={{fontSize:13,color:'#888',fontFamily:'var(--font-voice)'}}>{recipe.nombre}</span>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <div style={{display:'flex',gap:5}}>{pasos.map((_,i)=><div key={i} onClick={()=>setStep(i)} style={{width:7,height:7,borderRadius:99,cursor:'pointer',background:i===step?'#4a9eff':i<step?'#4a9eff55':'#333'}}/>)}</div>
          <button onClick={onExit} style={{fontSize:12,color:'#888',borderColor:'#333',padding:'4px 10px',background:'transparent'}}><i className="ti ti-x" style={{marginRight:3,fontSize:12}}/>Salir</button>
        </div>
      </div>
      <div style={{flex:1,padding:'28px 24px',display:'flex',flexDirection:'column',maxWidth:600,margin:'0 auto',width:'100%'}}>
        <div style={{fontSize:52,fontWeight:500,fontFamily:'var(--font-voice)',color:'#2a2a2a',lineHeight:1,marginBottom:4,userSelect:'none'}}>{String(step+1).padStart(2,'0')}</div>
        <div style={{fontSize:19,fontWeight:500,color:'#fff',fontFamily:'var(--font-voice)',marginBottom:14,lineHeight:1.3}}>{cur.titulo||`Paso ${step+1}`}</div>
        <div style={{fontSize:15,color:'#bbb',lineHeight:1.75,flex:1}}>{cur.descripcion}</div>
        {cur.timer&&<Timer key={`cook-${step}`} secs={Number(cur.timer)} big/>}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:24}}>
          <button disabled={step===0} onClick={()=>setStep(s=>s-1)} style={{color:'#999',borderColor:'#333',background:'transparent',fontSize:13,opacity:step===0?.25:1}}><i className="ti ti-arrow-left" style={{marginRight:4}}/>Anterior</button>
          <span style={{fontSize:12,color:'#777'}}>Paso {step+1} de {total}</span>
          {step<total-1
            ?<button onClick={()=>setStep(s=>s+1)} style={{...S.acct,fontSize:13}}>Siguiente<i className="ti ti-arrow-right" style={{marginLeft:4}}/></button>
            :<button onClick={onExit} style={{...S.success,fontSize:13}}><i className="ti ti-check" style={{marginRight:4}}/>Completado</button>}
        </div>
      </div>
    </div>
  );
}

// ── RecipeForm ────────────────────────────────────────────────────────────
function RecipeForm({initial,carpetas,onSave,onCancel}){
  const[f,setF]=useState({nombre:initial?.nombre||'',descripcion:initial?.descripcion||'',porciones_base:initial?.porciones_base||4,altitud:initial?.altitud??false,notas:initial?.notas||'',carpeta_id:initial?.carpeta_id||'',precio_venta:initial?.precio_venta??''});
  const[ings,setIngs]=useState(initial?.ingredientes?.length?initial.ingredientes.map(i=>({...i,_id:uid(),cantidad:i.cantidad??'',precio:i.precio??''})):[{_id:uid(),nombre:'',cantidad:'',unidad:'',precio:''}]);
  const[pasos,setPasos]=useState(initial?.pasos?.length?initial.pasos.map(p=>({...p,_id:uid(),timer:p.timer??''})):[{_id:uid(),titulo:'',descripcion:'',timer:''}]);
  const[errores,setErrores]=useState(initial?.errores||[]);
  const[newErr,setNewErr]=useState('');
  const[saving,setSaving]=useState(false);

  function addErr(){if(newErr.trim()){setErrores(e=>[...e,newErr.trim()]);setNewErr('')}}

  async function save(){
    if(!f.nombre.trim()){alert('La receta necesita un nombre');return}
    if(!(Number(f.porciones_base)>=1)){alert('Las porciones deben ser 1 o más');return}
    if(f.precio_venta!==''&&f.precio_venta!=null&&Number(f.precio_venta)<0){alert('El precio de venta no puede ser negativo');return}
    const ingsOk=ings.filter(i=>i.nombre.trim());
    if(ingsOk.some(i=>(i.cantidad!==''&&i.cantidad!=null&&Number(i.cantidad)<0)||(i.precio!==''&&i.precio!=null&&Number(i.precio)<0))){
      alert('Cantidades y precios no pueden ser negativos');return;
    }
    setSaving(true);
    const data={...f,porciones_base:Number(f.porciones_base)||4,carpeta_id:f.carpeta_id||null,
      precio_venta:f.precio_venta!==''&&f.precio_venta!=null?Number(f.precio_venta):null,
      ingredientes:ingsOk.map(i=>({nombre:i.nombre.trim(),cantidad:i.cantidad!==''&&i.cantidad!=null?Number(i.cantidad):null,unidad:i.unidad||null,precio:i.precio!==''&&i.precio!=null?Number(i.precio):null})),
      pasos:pasos.filter(p=>p.descripcion.trim()).map(p=>({titulo:p.titulo||null,descripcion:p.descripcion,timer:p.timer?Number(p.timer):null})),
      errores};
    await onSave(data);
    setSaving(false);
  }

  const updI=(id,k,v)=>setIngs(a=>a.map(x=>x._id===id?{...x,[k]:v}:x));
  const updP=(id,k,v)=>setPasos(a=>a.map(x=>x._id===id?{...x,[k]:v}:x));
  const ta={...S.inp,minHeight:56,resize:'vertical'};

  return(
    <div>
      <button onClick={onCancel} style={S.back}><i className="ti ti-arrow-left"/>{initial?'Volver':'Recetario'}</button>
      <h2 style={{fontSize:18,fontWeight:500,fontFamily:'var(--font-voice)',color:'var(--text-primary)',marginBottom:18}}>{initial?'Editar receta':'Nueva receta'}</h2>

      <div style={{marginBottom:14}}><label style={S.lbl}>Nombre</label><input style={S.inp} value={f.nombre} onChange={e=>setF(p=>({...p,nombre:e.target.value}))} placeholder="Carlota de durazno..."/></div>
      <div style={{marginBottom:14}}><label style={S.lbl}>Descripción</label><input style={S.inp} value={f.descripcion} onChange={e=>setF(p=>({...p,descripcion:e.target.value}))} placeholder="Una línea que la define..."/></div>

      <div style={{display:'flex',gap:14,marginBottom:14,flexWrap:'wrap'}}>
        <div style={{width:110}}><label style={S.lbl}>Porciones base</label><input style={S.inp} type="number" min="1" value={f.porciones_base} onChange={e=>setF(p=>({...p,porciones_base:e.target.value}))}/></div>
        <div style={{width:150}}><label style={S.lbl}>Precio de venta S/</label><input style={S.inp} type="number" min="0" step="0.01" placeholder="opcional" value={f.precio_venta} onChange={e=>setF(p=>({...p,precio_venta:e.target.value}))}/></div>
        <div style={{flex:1,minWidth:160}}>
          <label style={S.lbl}>Carpeta</label>
          <select style={{...S.inp}} value={f.carpeta_id||''} onChange={e=>setF(p=>({...p,carpeta_id:e.target.value}))}>
            <option value="">Sin carpeta</option>
            {carpetas.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}
          </select>
        </div>
        <div style={{display:'flex',alignItems:'flex-end',paddingBottom:2}}>
          <label style={{display:'flex',alignItems:'center',gap:6,fontSize:13,cursor:'pointer',color:'var(--text-muted)'}}><input type="checkbox" checked={f.altitud} onChange={e=>setF(p=>({...p,altitud:e.target.checked}))}/>Altitud</label>
        </div>
      </div>

      <div style={{marginBottom:14}}>
        <label style={S.lbl}>Ingredientes</label>
        <div style={{display:'grid',gridTemplateColumns:'1fr 75px 55px 70px 28px',gap:4,marginBottom:4}}>
          {['Nombre','Cantidad','Unidad','S/',''].map((h,i)=><span key={i} style={{fontSize:10,color:'var(--text-muted)',padding:'0 2px'}}>{h}</span>)}
        </div>
        {ings.map(ing=>(
          <div key={ing._id} style={{display:'grid',gridTemplateColumns:'1fr 75px 55px 70px 28px',gap:4,marginBottom:5}}>
            <input style={S.inp} placeholder="Nombre" value={ing.nombre} onChange={e=>updI(ing._id,'nombre',e.target.value)}/>
            <input style={S.inp} type="number" min="0" placeholder="0" value={ing.cantidad} onChange={e=>updI(ing._id,'cantidad',e.target.value)}/>
            <input style={S.inp} placeholder="g/ml" value={ing.unidad||''} onChange={e=>updI(ing._id,'unidad',e.target.value)}/>
            <input style={S.inp} type="number" min="0" step="0.01" placeholder="0.00" value={ing.precio??''} onChange={e=>updI(ing._id,'precio',e.target.value)}/>
            <button onClick={()=>setIngs(a=>a.filter(x=>x._id!==ing._id))} style={{padding:0,width:28,height:28,color:'var(--text-muted)'}} title="Quitar ingrediente"><i className="ti ti-x" style={{fontSize:13}}/></button>
          </div>
        ))}
        <button onClick={()=>setIngs(a=>[...a,{_id:uid(),nombre:'',cantidad:'',unidad:'',precio:''}])} style={{width:'100%',borderStyle:'dashed',fontSize:12,color:'var(--text-muted)',marginTop:2}}><i className="ti ti-plus" style={{marginRight:4}}/>Ingrediente</button>
      </div>

      <div style={{marginBottom:14}}>
        <label style={S.lbl}>Pasos</label>
        {pasos.map((p,i)=>(
          <div key={p._id} style={{display:'flex',gap:8,marginBottom:10,alignItems:'flex-start'}}>
            <div style={{...S.num,marginTop:6}}>{i+1}</div>
            <div style={{flex:1,display:'grid',gap:4}}>

              <textarea style={ta} placeholder="Descripción..." value={p.descripcion} onChange={e=>updP(p._id,'descripcion',e.target.value)}/>
              <input style={S.inp} type="number" min="0" placeholder="Timer en segundos (ej: 14400 = 4h)" value={p.timer} onChange={e=>updP(p._id,'timer',e.target.value)}/>
            </div>
            <button onClick={()=>setPasos(a=>a.filter(x=>x._id!==p._id))} style={{padding:0,width:28,height:28,color:'var(--text-muted)',marginTop:4,flexShrink:0}} title="Quitar paso"><i className="ti ti-x" style={{fontSize:13}}/></button>
          </div>
        ))}
        <button onClick={()=>setPasos(a=>[...a,{_id:uid(),titulo:'',descripcion:'',timer:''}])} style={{width:'100%',borderStyle:'dashed',fontSize:12,color:'var(--text-muted)',marginTop:2}}><i className="ti ti-plus" style={{marginRight:4}}/>Paso</button>
      </div>

      <div style={{marginBottom:14}}><label style={S.lbl}>Notas</label><textarea style={{...S.inp,minHeight:70,resize:'vertical'}} value={f.notas} onChange={e=>setF(p=>({...p,notas:e.target.value}))} placeholder="Tips, ajuste de altitud..."/></div>

      <div style={{marginBottom:18}}>
        <label style={S.lbl}>Errores registrados</label>
        {errores.map((e,i)=>(
          <div key={i} style={{display:'flex',gap:6,marginBottom:5,alignItems:'center'}}>
            <div style={{flex:1,fontSize:13,padding:'7px 11px',background:'var(--bg-warning)',color:'var(--text-warning)',borderRadius:8}}>{e}</div>
            <button onClick={()=>setErrores(a=>a.filter((_,j)=>j!==i))} style={{padding:0,width:26,height:26,color:'var(--text-muted)'}} title="Quitar error"><i className="ti ti-x" style={{fontSize:12}}/></button>
          </div>
        ))}
        <div style={{display:'flex',gap:5}}>
          <input style={S.inp} placeholder="¿Qué salió mal?" value={newErr} onChange={e=>setNewErr(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addErr()}/>
          <button onClick={addErr}><i className="ti ti-plus"/></button>
        </div>
      </div>

      <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
        <button onClick={onCancel}>Cancelar</button>
        <button onClick={save} style={S.acct} disabled={saving}><i className="ti ti-check" style={{marginRight:4}}/>{saving?'Guardando...':'Guardar'}</button>
      </div>
    </div>
  );
}

// ── CarpetasManager ───────────────────────────────────────────────────────
const COLORS=['#4a9eff','#e74c3c','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e91e63'];
function CarpetasManager({carpetas,onSave,onDelete,onClose}){
  const[nombre,setNombre]=useState('');const[color,setColor]=useState(COLORS[0]);const[saving,setSaving]=useState(false);
  async function add(){if(!nombre.trim())return;setSaving(true);await onSave({nombre:nombre.trim(),color});setNombre('');setSaving(false)}
  return(
    <div>
      <button onClick={onClose} style={S.back}><i className="ti ti-arrow-left"/>Recetario</button>
      <h2 style={{fontSize:18,fontWeight:500,fontFamily:'var(--font-voice)',color:'var(--text-primary)',marginBottom:18}}>Carpetas</h2>
      <div style={{display:'grid',gap:6,marginBottom:20}}>
        {carpetas.map(c=>(
          <div key={c.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',background:'var(--surface-2)',borderRadius:10,border:'.5px solid var(--border)'}}>
            <div style={{width:12,height:12,borderRadius:99,background:c.color,flexShrink:0}}/>
            <span style={{flex:1,fontSize:14,color:'var(--text-primary)'}}>{c.nombre}</span>
            <button onClick={()=>onDelete(c.id)} style={{padding:0,width:26,height:26,color:'var(--text-muted)'}} title="Eliminar carpeta"><i className="ti ti-trash" style={{fontSize:13}}/></button>
          </div>
        ))}
        {carpetas.length===0&&<p style={{fontSize:13,color:'var(--text-muted)'}}>Sin carpetas aún.</p>}
      </div>
      <div style={{padding:'16px',background:'var(--surface-2)',borderRadius:12,border:'.5px solid var(--border)'}}>
        <label style={S.lbl}>Nueva carpeta</label>
        <input style={{...S.inp,marginBottom:10}} placeholder="Nombre..." value={nombre} onChange={e=>setNombre(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()}/>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
          {COLORS.map(c=><div key={c} onClick={()=>setColor(c)} style={{width:24,height:24,borderRadius:99,background:c,cursor:'pointer',border:color===c?'3px solid var(--text-primary)':'3px solid transparent',transition:'border .1s'}}/>)}
        </div>
