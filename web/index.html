<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recetario</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#f8f5f0;color:#1a1a1a;-webkit-font-smoothing:antialiased}
    main{max-width:520px;margin:0 auto;padding:56px 16px}
    h1{font-family:Georgia,serif;font-size:34px;font-weight:500;margin-bottom:6px}
    .sub{font-size:15px;color:#6b6560;line-height:1.5;margin-bottom:28px}
    .card{display:block;background:#fff;border:.5px solid rgba(0,0,0,.16);border-radius:12px;padding:18px;margin-bottom:12px;text-decoration:none;color:inherit}
    a.card:hover{border-color:#3b82f6}
    .card strong{display:block;font-size:16px;margin-bottom:4px}
    .card span{font-size:13px;color:#6b6560;line-height:1.5}
    form{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    input{flex:1;min-width:180px;padding:9px 11px;border:.5px solid rgba(0,0,0,.2);border-radius:8px;font-size:14px}
    button{padding:9px 16px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:14px;cursor:pointer}
  </style>
</head>
<body>
<main>
  <h1>Recetario</h1>
  <p class="sub">Recetas estandarizadas con medidas, costos y menú del día.</p>

  <a class="card" href="recetario.html">
    <strong>Entrar al recetario</strong>
    <span>Para el personal del local: dueño, chef y ayudantes.</span>
  </a>

  <div class="card">
    <strong>Ver el menú de hoy</strong>
    <span>Para clientes. Escribe el código del local.</span>
    <form id="f">
      <input id="c" placeholder="ej.: local-de-ejemplo" autocapitalize="none" autocomplete="off"/>
      <button type="submit">Ver menú</button>
    </form>
  </div>
</main>
<script>
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();
  var v=document.getElementById('c').value.trim();
  if(v) location.href='menu.html?local='+encodeURIComponent(v);
});
</script>
</body>
</html>
